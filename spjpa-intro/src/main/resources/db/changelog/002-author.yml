databaseChangeLog:
- changeSet:
    id: author-1
    author: alessandro-marchino
    changes:
    - createTable:
        columns:
        - column:
            constraints:
              nullable: false
              primaryKey: true
            name: id
            type: BIGINT
        - column:
            name: first_name
            type: VARCHAR(255)
        - column:
            name: last_name
            type: VARCHAR(255)
        tableName: author
    - createTable:
        columns:
        - column:
            name: next_val
            type: BIGINT
        tableName: author_seq
    - insert:
        tableName: author_seq
        columns:
        - column:
            name: next_val
            value: 1

