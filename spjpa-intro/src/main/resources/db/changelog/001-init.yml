databaseChangeLog:
- changeSet:
    id: 1791979585933-1
    author: alessandro-marchino
    changes:
    - createTable:
        columns:
        - column:
            constraints:
              nullable: false
              primaryKey: true
            name: id
            type: BIGINT
        - column:
            name: isbn
            type: VARCHAR(255)
        - column:
            name: publisher
            type: VARCHAR(255)
        - column:
            name: title
            type: VARCHAR(255)
        tableName: book
- changeSet:
    id: 1791979585933-2
    author: alessandro-marchino
    changes:
    - createTable:
        columns:
        - column:
            name: next_val
            type: BIGINT
        tableName: book_seq
- changeSet:
    id: 1791979585933-3
    author: alessandro-marchino
    changes:
    - insert:
        tableName: book_seq
        columns:
        - column:
            name: next_val
            value: 1

