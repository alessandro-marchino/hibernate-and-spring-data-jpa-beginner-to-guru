spring:
  application:
    name: order-service

  datasource:
    username: orderuser
    password: password
    url: jdbc:mysql://localhost:3306/orderdb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Rome
  jpa:
    open-in-view: false
    properties:
      '[hibernate.dialect]': org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
  flyway:
    user: orderadmin
    password: password
